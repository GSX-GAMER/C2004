plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gsxgamer.c2004'
    compileSdk 35
    defaultConfig { applicationId 'com.gsxgamer.c2004'; minSdk 16; targetSdk 28; versionCode 2; versionName '0.2.0' }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_8; targetCompatibility JavaVersion.VERSION_8 }
    packagingOptions { resources.excludes += ['META-INF/DEPENDENCIES','META-INF/LICENSE','META-INF/LICENSE.txt','META-INF/NOTICE','META-INF/NOTICE.txt'] }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
